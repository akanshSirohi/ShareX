apply plugin: 'com.android.application'

abstract class VerifyWebUiPackaging extends DefaultTask {
    @InputFile
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract RegularFileProperty getPortalArchive()

    @InputDirectory
    @PathSensitive(PathSensitivity.RELATIVE)
    abstract DirectoryProperty getApkDirectory()

    @TaskAction
    void verify() {
        File portal = portalArchive.get().asFile
        def apks = apkDirectory.get().asFile.listFiles().findAll { it.name.endsWith('.apk') }
        if (apks.isEmpty()) throw new GradleException('No APK available for web UI verification')
        for (File apk : apks) {
            new java.util.zip.ZipFile(apk).withCloseable { archive ->
                String entryName = "assets/${portal.name}"
                def entry = archive.getEntry(entryName)
                if (entry == null) throw new GradleException("Web UI archive missing from ${apk.name}: ${entryName}")
                archive.getInputStream(entry).withCloseable { input ->
                    if (!Arrays.equals(portal.bytes, input.readAllBytes())) {
                        throw new GradleException("Web UI archive differs in ${apk.name}")
                    }
                }
                logger.lifecycle("Verified web UI archive in ${apk.name}")
            }
        }
    }
}

// The exported asset folder is the web UI version. Node is only needed when rebuilding the portal.
def webUiConfig = new groovy.json.JsonSlurper().parseText(
        providers.fileContents(rootProject.layout.projectDirectory.file('web/web-ui.json')).asText.get())
def webUiFolder = webUiConfig.assetFolder
if (!(webUiFolder ==~ /sharex_web_v\d+(?:_\d+)*/)) {
    throw new GradleException('Invalid web UI assetFolder in web/web-ui.json')
}

android {
    compileSdk 37
    buildFeatures {
        buildConfig true
    }
    ndkVersion "24.0.8215888"

    androidResources {
        // Keep normal metadata exclusions, but allow Next.js's _next asset directory.
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    defaultConfig {
        buildConfigField 'String', 'WEB_INTERFACE_DIR', '"' + webUiFolder + '"'
        applicationId "com.akansh.sharex"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 33
        versionName "3.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def apkName = "Sharex-v${defaultConfig.versionName}.apk"
            outputFileName = apkName
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/*.kotlin_module']
        }
    }

