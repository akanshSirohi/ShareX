apply plugin: 'com.android.application'

android {
    compileSdk 37
    buildFeatures {
        buildConfig true
    }
    ndkVersion "24.0.8215888"

    defaultConfig {
        applicationId "com.akansh.fileserversuit"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 33
        versionName "3.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            def apkName = "Sharex-v${defaultConfig.versionName}.apk"
            outputFileName = apkName
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt', 'META-INF/notice.txt', 'META-INF/ASL2.0', 'META-INF/*.kotlin_module']
        }
    }

//    task fixLineEndings(type: Copy) {
//        from('src/main/assets') {
//            include '**/*.html', '**/*.css', '**/*.js'
//            filter {
//                String line = it.toString()
//                line.replaceAll("(?<!\\r)\\n", "\\r\\n")
//            }
//        }
//        into('build/intermediates/assets/release')
//    }

//    tasks.configureEach { task ->
//        if (task.name.startsWith('assemble')) {
//            task.dependsOn fixLineEndings
//        }
//    }


    namespace 'com.akansh.fileserversuit'

}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'io.netty:netty-transport:4.2.18.Final'
    implementation 'io.netty:netty-codec-http:4.2.18.Final'
    implementation 'io.netty:netty-handler:4.2.18.Final'
    implementation 'commons-io:commons-io:2.18.0'
    implementation 'net.lingala.zip4j:zip4j:2.11.6'
    implementation 'com.github.clans:fab:1.6.4'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.github.dlazaro66:QRCodeReaderView:2.0.3'
    implementation 'com.github.akanshSirohi:QRSmith:2.1.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'com.jayway.jsonpath:json-path:3.0.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
repositories {
    mavenCentral()
}
