dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'io.netty:netty-transport:4.2.18.Final'
    implementation 'io.netty:netty-codec-http:4.2.18.Final'
    implementation 'io.netty:netty-handler:4.2.18.Final'
    implementation 'commons-io:commons-io:2.18.0'
    implementation 'net.lingala.zip4j:zip4j:2.11.6'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.github.dlazaro66:QRCodeReaderView:2.0.3'
    implementation 'com.github.akanshSirohi:QRSmith:2.1.0'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'com.jayway.jsonpath:json-path:3.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
