repositories {
    mavenCentral()
}

// Keep Android builds independent of npm while rejecting missing or stale portal exports.
def verifyWebUiAssets = tasks.register('verifyWebUiAssets') {
    def portalArchive = file("src/main/assets/${webUiFolder}.zip")
    inputs.file(rootProject.file('web/web-ui.json'))
    inputs.file(portalArchive)
    doLast {
        if (!portalArchive.isFile()) throw new GradleException('Web UI archive missing. Run npm ci and npm run build:assets in web/.')
        new java.util.zip.ZipFile(portalArchive).withCloseable { archive ->
            def manifest = archive.getEntry('build-info.json')
            if (archive.getEntry('index.html') == null || manifest == null) {
                throw new GradleException('Web UI archive incomplete. Run npm run build:assets in web/.')
            }
            archive.getInputStream(manifest).withCloseable { input ->
                if (new groovy.json.JsonSlurper().parse(input).assetFolder != webUiFolder) {
                    throw new GradleException('Web UI version mismatch. Run npm run build:assets in web/.')
                }
            }
        }
    }
}

tasks.named('preBuild').configure { dependsOn(verifyWebUiAssets) }

// Archive extraction tests must rerun when the packaged build changes.
tasks.withType(Test).configureEach {
    inputs.file(layout.projectDirectory.file("src/main/assets/${webUiFolder}.zip"))
}

// Check the APK itself to catch missing or altered archives.
androidComponents.onVariants(androidComponents.selector().all()) { variant ->
    String variantName = variant.name.capitalize()
    def verification = tasks.register("verify${variantName}WebUiPackaging", VerifyWebUiPackaging) {
        portalArchive.set(layout.projectDirectory.file("src/main/assets/${webUiFolder}.zip"))
        apkDirectory.set(variant.artifacts.get(com.android.build.api.artifact.SingleArtifact.APK.INSTANCE))
    }
    tasks.matching { it.name == "assemble${variantName}" }.configureEach {
        dependsOn(verification)
    }
}
